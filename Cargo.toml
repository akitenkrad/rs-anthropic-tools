[package]
name = "anthropic-tools"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
description = "A Rust library for interacting with the Anthropic API"
license = "MIT"
repository = "https://github.com/akitenkrad/rs-anthropic-tools"
documentation = "https://docs.rs/anthropic-tools"
readme = "README.md"
keywords = ["anthropic", "claude", "api", "ai", "llm"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
base64 = "0.22.1"
dotenvy = "0.15"
image = "0.25.9"
request = { package = "reqwest", version = "0.13.1", features = [
  "blocking",
  "json",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }

[dev-dependencies]
dotenvy = "0.15"
test-log = { version = "0.2.19", features = ["trace"] }
